{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="login-wrap">
  <h1>Clio Dashboard</h1>
  <p class="subtitle">Collier Law — internal tools</p>
  <div class="panel">
    <form class="stacked" method="post" action="/login">
      <label for="passphrase">Passphrase</label>
      <div class="password-field">
        <input type="text" id="passphrase" name="passphrase" autocomplete="current-password" autofocus required>
        <span class="password-toggle" id="passphrase-toggle" role="button" tabindex="0" aria-label="Hide passphrase">
          <svg id="eye-open" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          <svg id="eye-closed" style="display:none;" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
        </span>
      </div>
      {% if error %}<p class="error-text">{{ error }}</p>{% endif %}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Log in</button>
    </form>
  </div>
</div>
<script>
(function () {
  const input = document.getElementById("passphrase");
  const toggle = document.getElementById("passphrase-toggle");
  const eyeOpen = document.getElementById("eye-open");
  const eyeClosed = document.getElementById("eye-closed");
  function togglePassphrase() {
    const showing = input.type === "text";
    input.type = showing ? "password" : "text";
    eyeOpen.style.display = showing ? "none" : "block";
    eyeClosed.style.display = showing ? "block" : "none";
    toggle.setAttribute("aria-label", showing ? "Show passphrase" : "Hide passphrase");
  }
  toggle.addEventListener("click", togglePassphrase);
  toggle.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      togglePassphrase();
    }
  });
})();
</script>
{% endblock %}
